<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم العيادة - نظام إدارة الطوابير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- الهيدر -->
        <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">مركز الشفاء الطبي - عيادة الأسنان</h1>
                <p class="text-xs text-slate-400">لوحة التحكم والاستدعاء اللحظي</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                <span class="text-xs text-emerald-400 font-medium">متصل بالخادم</span>
            </div>
        </header>

        <!-- البطاقة الرئيسية: العميل الحالي -->
        <main class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700 shadow-xl text-center space-y-6">
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full text-xs">
                في العيادة الآن
            </span>
            
            <div class="space-y-2">
                <div id="currentTicketNum" class="text-6xl font-extrabold text-emerald-400 tracking-wider"><span dir="ltr">#--</span></div>
                <div id="currentPatientName" class="text-lg text-slate-300">العميل: --</div>
                <div id="currentService" class="text-sm text-slate-400">الخدمة: --</div>
            </div>

            <!-- أزرار التحكم -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4">
                <button id="callNextBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition active:scale-95">
                    📞 استدعاء التالي
                </button>
                <button class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-3 px-4 rounded-xl border border-slate-600 transition">
                    🔔 إعادة تنبيه
                </button>
                <button class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-medium py-3 px-4 rounded-xl border border-rose-500/30 transition">
                    ⏭️ تخطي / غياب
                </button>
            </div>
        </main>

        <!-- قائمة الانتظار الحالية -->
        <section class="bg-slate-800 rounded-xl p-5 border border-slate-700">
            <h2 id="queueTitle" class="text-md font-bold mb-4 text-slate-200 flex items-center gap-2">
                <span>📋</span> القادمون في الانتظار (0 مراجعين)
            </h2>
            <div id="waitingListContainer" class="space-y-2">
                <!-- يتم تعبئتها ديناميكياً من الخادم -->
            </div>
        </section>
    </div>

<!-- استدعاء مكتبة Socket.io للربط اللحظي -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    const clinicId = "1"; // معرف العيادة الحالي

    // الانضمام لغرفة العيادة فور فتح الصفحة
    socket.emit('join_clinic', clinicId);

    // الاستماع لأي تحديثات فورية تطرأ على الطابور
    socket.on('queue_updated', (data) => {
        console.log('تم تحديث الطابور:', data);
        fetchQueueData();
    });

    // ربط زر "استدعاء التالي" بإرسال طلب للباك اند
    document.getElementById('callNextBtn').addEventListener('click', async () => {
        try {
            const response = await fetch(`/api/clinics/${clinicId}/call-next`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            const text = await response.text();
            const result = text ? JSON.parse(text) : {};

            if (response.ok && result.success) {
                alert('تم استدعاء المريض التالي بنجاح!');
                fetchQueueData();
            } else {
                alert(result.message || 'لا يوجد مرضى في الانتظار حالياً');
            }
        } catch (error) {
            console.error('خطأ في الاتصال بالخادم:', error);
            alert('حدث خطأ أثناء الاتصال بالخادم');
        }
    });

    // جلب بيانات الطابور وتحديث الواجهة بالكامل بشكل دقيق
    async function fetchQueueData() {
        try {
            const response = await fetch(`/api/clinics/${clinicId}/queue`);
            const data = await response.json();
            
            if (data.success && data.queue) {
                // 1. العميل الحالي في العيادة
                const currentPatient = data.queue.find(t => t.status === 'in_consultation') || data.queue.find(t => t.status === 'serving') || data.queue[0];
                
                // 2. قائمة الانتظار الحقيقية (استبعاد العميل الحالي)
                const waitingPatients = data.queue.filter(t => t.status === 'waiting');
                const nextPatient = waitingPatients.length > 0 ? waitingPatients[0] : null;

                // تحديث واجهة العميل الحالي
                const ticketNumElement = document.getElementById('currentTicketNum');
                const patientNameElement = document.getElementById('currentPatientName');
                const serviceElement = document.getElementById('currentService');

                if (currentPatient) {
                    const ticketNum = currentPatient.ticket_number || currentPatient.sequence_num || '--';
                    if (ticketNumElement) ticketNumElement.innerHTML = `<span dir="ltr">#${ticketNum}</span>`;
                    
                    const realName = currentPatient.patient_name && currentPatient.patient_name.trim() !== "" 
                        ? currentPatient.patient_name 
                        : 'مريض';
                    if (patientNameElement) patientNameElement.textContent = `العميل: ${realName}`;
                    
                    if (serviceElement) serviceElement.textContent = `الخدمة: ${currentPatient.service_name || 'كشف جديد'}`;
                } else {
                    if (ticketNumElement) ticketNumElement.innerHTML = `<span dir="ltr">#--</span>`;
                    if (patientNameElement) patientNameElement.textContent = `العميل: لا يوجد مراجع حالياً`;
                    if (serviceElement) serviceElement.textContent = `الخدمة: --`;
                }

                // تحديث نص وزر "استدعاء التالي" برقم التذكرة القادمة
                const callNextBtn = document.getElementById('callNextBtn');
                if (callNextBtn) {
                    if (nextPatient) {
                        const nextNum = nextPatient.ticket_number || nextPatient.sequence_num;
                        callNextBtn.textContent = `📞 استدعاء التالي (#${nextNum})`;
                    } else {
                        callNextBtn.textContent = `📞 استدعاء التالي (لا يوجد منتظرين)`;
                    }
                }

                // تحديث قائمة الانتظار بصرياً بالأسماء والأرقام الحقيقية
                const waitingContainer = document.getElementById('waitingListContainer');
                const queueTitle = document.getElementById('queueTitle');
                
                if (queueTitle) {
                    queueTitle.innerHTML = `<span>📋</span> القادمون في الانتظار (${waitingPatients.length} مراجعين)`;
                }

                if (waitingContainer) {
                    waitingContainer.innerHTML = '';
                    if (waitingPatients.length === 0) {
                        waitingContainer.innerHTML = `<div class="p-3 text-center text-slate-500 text-sm">لا توجد حجزات في الانتظار حالياً</div>`;
                    } else {
                        waitingPatients.forEach((p, index) => {
                            const pNum = p.ticket_number || p.sequence_num;
                            const pName = p.patient_name && p.patient_name.trim() !== "" ? p.patient_name : 'مراجع';
                            const estTime = (index + 1) * 10; // تقدير 10 دقائق لكل مريض قبله

                            const item = document.createElement('div');
                            item.className = "flex justify-between items-center p-3 bg-slate-900/60 rounded-lg border border-slate-700/50";
                            item.innerHTML = `
                                <div>
                                    <span class="font-bold text-emerald-400 ml-3" dir="ltr">#${pNum}</span>
                                    <span class="text-sm text-slate-300">${pName}</span>
                                </div>
                                <span class="text-xs text-slate-400">وقت الانتظار: ~${estTime} دقائق</span>
                            `;
                            waitingContainer.appendChild(item);
                        });
                    }
                }
            }
        } catch (error) {
            console.error('خطأ أثناء جلب قائمة الانتظار:', error);
        }
    }

    // جلب البيانات فور تحميل الصفحة
    fetchQueueData();
</script>
</body>
</html>
